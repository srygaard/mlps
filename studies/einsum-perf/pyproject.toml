[project]
name = "einsum-perf"
version = "0.1.0"
description = "Performance study: einsum vs native vs opt_einsum across JAX and PyTorch"
authors = [{ name = "Steven Rygaard", email = "steven.rygaard@mila.quebec" }]
requires-python = ">=3.14"
dependencies = [
    "jax[cuda13]>=0.9.2",
    "matplotlib>=3.10.0",
    "mlps-shared",
    "opt-einsum>=3.4.0",
    "torch>=2.11.0",
]

[tool.uv.sources]
mlps-shared = { path = "../../shared", editable = true }
