[project]
name = "mlps"
version = "0.1.0"
description = "ML performance studies"
authors = [{ name = "Steven Rygaard", email = "steven.rygaard@mila.quebec" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
"cuda-mps" = [
    "mlps-shared",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "torch",
]
"einsum-perf" = [
    "mlps-shared",
    "jax[cuda13]>=0.9.2",
    "matplotlib>=3.10.0",
    "opt-einsum>=3.4.0",
    "torch>=2.11.0",
]
"python-optimization-flags" = [
    "mlps-shared",
    "numpy",
    "torch",
]

[tool.uv.sources]
mlps-shared = { path = "shared", editable = true }

[build-system]
requires = ["setuptools>=67.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
