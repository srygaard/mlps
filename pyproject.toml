[project]
name = "mlps"
version = "0.1.0"
description = "ML performance studies"
authors = [{ name = "Steven Rygaard", email = "steven.rygaard@mila.quebec" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["torch>=2.14.1"]

[project.optional-dependencies]
"cuda-mps" = [
    "mlps-shared",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
]
"einsum-perf" = [
    "mlps-shared",
    "jax[cuda13]>=0.9.2",
    "matplotlib>=3.10.0",
    "opt-einsum>=3.4.0",
]
"flash-attn-4" = [
    "matplotlib>=3.10.0",
    "mlps-shared",
    "flash-attn-4[cu13]>=4.0.0b35; sys_platform == 'linux'",
    "pytest>=9.1.1",
    "triton>=3.8.0; sys_platform == 'linux'",
]
"python-optimization-flags" = [
    "mlps-shared",
    "numpy",
]

[tool.uv.sources]
mlps-shared = { path = "shared", editable = true }

[build-system]
requires = ["setuptools>=67.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
